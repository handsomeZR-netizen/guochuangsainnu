# Netlify 部署配置文件

[build]
  # 构建命令
  command = "npm run build"
  
  # 构建输出目录
  publish = "dist"
  
  # Functions 目录
  functions = "netlify/functions"
  
  # Node.js 版本
  [build.environment]
    NODE_VERSION = "18"

# 重定向规则 - SPA路由支持
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# 头部配置 - 安全和性能优化
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# 静态资源缓存
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# 字体文件缓存
[[headers]]
  for = "/*.woff2"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# 图片缓存
[[headers]]
  for = "/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# 开发环境配置
[context.deploy-preview]
  command = "npm run build"

[context.branch-deploy]
  command = "npm run build"

# 插件配置（可选）
[[plugins]]
  package = "@netlify/plugin-lighthouse"
